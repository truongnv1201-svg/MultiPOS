name: Backup DB (free)

on:
  schedule:
    # 18:00 UTC = 01:00 GMT+7 hôm sau — chạy đêm mỗi ngày, tốn ~1-2 phút Actions/ngày (free).
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Chưa cấu hình secret SUPABASE_DB_URL — bỏ qua backup (xem docs/backup-free.md)."
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
            # Chẩn đoán định dạng (chỉ in hình dạng, KHÔNG in giá trị secret).
            echo "db-url-len=${#SUPABASE_DB_URL}"
            case "$SUPABASE_DB_URL" in
              postgresql://*) echo "db-scheme=OK (postgresql://)" ;;
              *) echo "db-scheme=BAD — phải bắt đầu bằng postgresql:// (lấy ở Database → Connection string → Direct connection)" ;;
            esac
            case "$SUPABASE_DB_URL" in
              *@*) echo "db-has-at=OK" ;;
              *) echo "db-has-at=BAD — thiếu đoạn user:pass@host (có thể đã dán nhầm Project URL https://... hoặc anon key)" ;;
            esac
          fi
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_ACCESS_KEY_ID" ] || [ -z "$S3_SECRET_ACCESS_KEY" ] || [ -z "$S3_BUCKET" ]; then
            echo "s3=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Chưa đủ secret S3_* (B2) — chỉ lưu Artifact 30 ngày, chưa có bản off-site dài hạn."
          else
            echo "s3=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump Postgres (custom format + gzip)
        if: steps.gate.outputs.db == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          mkdir -p backup
          # Dùng image postgres:17 khớp major version Supabase (config.toml major_version = 17).
          docker run --rm postgres:17 pg_dump --version
          # Tách host/port/db/user bằng urllib (chuẩn URL, chịu được mật khẩu có ký tự đặc biệt).
          eval "$(python3 - <<'EOF'
          import os, shlex, urllib.parse
          u = urllib.parse.urlparse(os.environ['SUPABASE_DB_URL'])
          user = u.username or 'postgres'
          pwd = urllib.parse.unquote(u.password or '')
          host = u.hostname or ''
          port = u.port or 5432
          db = (u.path or '/postgres').lstrip('/') or 'postgres'
          print(f"USER={shlex.quote(user)}")
          print(f"HOST={shlex.quote(host)}")
          print(f"PORT={shlex.quote(str(port))}")
          print(f"DB={shlex.quote(db)}")
          print(f"PASS={shlex.quote(pwd)}")
          EOF
          )"
          [ -z "$HOST" ] && { echo "❌ Không tách được host từ SUPABASE_DB_URL."; exit 1; }
          echo "::add-mask::$PASS"
          echo "Dump $USER@$HOST:$PORT/$DB ..."
          docker run --rm \
            -e PGPASSWORD="$PASS" \
            -v "$PWD/backup:/backup" \
            postgres:17 pg_dump -h "$HOST" -p "$PORT" -U "$USER" -d "$DB" \
              --format=custom --compress=9 --no-owner --no-acl \
              --file "/backup/multipos-$DATE.dump"
          gzip -9 -c "backup/multipos-$DATE.dump" > "backup/multipos-$DATE.dump.gz"
          rm "backup/multipos-$DATE.dump"
          # Mã hóa đối xứng nếu có BACKUP_PASSPHRASE (khuyến nghị), không thì giữ file .gz thường.
          ENCRYPTED=false
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              -c --cipher-algo AES256 "backup/multipos-$DATE.dump.gz"
            rm "backup/multipos-$DATE.dump.gz"
            ls -lh backup/
            ENCRYPTED=true
          fi
          # Ghi tên trần (không prefix backup/) để file sha dùng được ở mọi nơi.
          (cd backup && sha256sum multipos-* > "multipos-$DATE.sha256")
          cat backup/*.sha256
          {
            echo "## Backup $DATE (UTC)"
            echo "- File: $(ls backup/ | tr '\n' ' ')"
            echo "- Size: $(du -h backup/* | tr '\n' ' ')"
            if [ "$ENCRYPTED" = "true" ]; then
              echo "- Mã hóa: GPG AES256 (cần BACKUP_PASSPHRASE để giải)"
            else
              echo "- Mã hóa: KHÔNG (nên thêm secret BACKUP_PASSPHRASE)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (giữ 30 ngày — bản dự phòng)
        if: steps.gate.outputs.db == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: multipos-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error

      - name: Push lên B2 (trụ off-site dài hạn)
        if: steps.gate.outputs.db == 'true' && steps.gate.outputs.s3 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp backup/ "s3://$S3_BUCKET/daily/" --recursive \
            --endpoint-url "$S3_ENDPOINT" --region "${S3_REGION:-us-east-1}"
          echo "Đã đẩy $(ls backup/ | tr '\n' ' ') lên s3://$S3_BUCKET/daily/"

      - name: Xoay vòng (30 bản ngày + 12 bản tháng)
        if: steps.gate.outputs.db == 'true' && steps.gate.outputs.s3 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "daily/" \
            --endpoint-url "$S3_ENDPOINT" --region "${S3_REGION:-us-east-1}" \
            --query 'Contents[].Key' --output json > /tmp/keys.json
          python3 - "$S3_BUCKET" "$S3_ENDPOINT" "${S3_REGION:-us-east-1}" <<'EOF'
          import json, re, subprocess, sys
          from datetime import date
          bucket, endpoint, region = sys.argv[1], sys.argv[2], sys.argv[3]
          keys = json.load(open('/tmp/keys.json')) or []
          today = date.today()
          kept, deleted = 0, []
          for key in keys:
              m = re.search(r'multipos-(\d{4})-(\d{2})-(\d{2})', key)
              if not m:
                  kept += 1
                  continue
              d = date(int(m.group(1)), int(m.group(2)), int(m.group(3)))
              age = (today - d).days
              # Giữ: 30 ngày gần nhất + bản ngày 01 (bản tháng) trong 365 ngày.
              if age <= 30 or (d.day == 1 and age <= 365):
                  kept += 1
                  continue
              subprocess.run(
                  ['aws', 's3', 'rm', f's3://{bucket}/{key}',
                   '--endpoint-url', endpoint, '--region', region],
                  check=True)
              deleted.append(key)
          print(f'Giu {kept} file, xoa {len(deleted)} file qua han.')
          for k in deleted:
              print(f'  xoa: {k}')
          EOF
